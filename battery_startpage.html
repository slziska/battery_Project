<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Process Starter</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ffe1f0, #ffc4e0);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(219, 39, 119, 0.2);
    text-align: center;
    max-width: 420px;
    width: 90%;
  }
  h1 {
    color: #db2777;
    font-size: 24px;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #be185d;
    font-size: 14px;
    margin-bottom: 28px;
  }
  button {
    background: #ec4899;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:hover {
    background: #db2777;
  }
  button:disabled {
    background: #f9a8d4;
    cursor: not-allowed;
  }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  #status.show { display: block; }
  #status.ok { background: #fce7f3; color: #be185d; }
  #status.err { background: #fee2e2; color: #b91c1c; }
</style>
</head>
<body>
<div class="card">
  <h1>Battery Process</h1>
  <div class="subtitle">LIB/NIB Manufacturing</div>
  <button id="startBtn" onclick="startProcess()">Start Process</button>
  <div id="status"></div>
</div>

<script>
const BASE_URL = "http://localhost:8080/engine-rest";
const PROCESS_KEY = "Process_LIB_Manufacturing";

function showStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'show ' + (ok ? 'ok' : 'err');
}

async function startProcess() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = "Starting...";
  try {
    const res = await fetch(`${BASE_URL}/process-definition/key/${PROCESS_KEY}/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ variables: {} })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    showStatus('✓ Started! Instance: ' + data.id.slice(0, 8) + '...', true);
  } catch (e) {
    showStatus('✗ Failed: ' + e.message, false);
  }
  btn.disabled = false;
  btn.textContent = "Start Process";
}
</script>
</body>
</html>
